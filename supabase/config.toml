# Pins verify_jwt per Edge Function so a plain `supabase functions deploy` from this repo
# reproduces the intended gateway posture (rather than silently applying the verify_jwt=true
# default and breaking the webhook + anon-signing + pg_cron paths).
#
# Every function enforces its OWN auth in code — an authenticated user's JWT (currentUser),
# the internal x-internal-secret (== CRON_SECRET) header for server/pg_cron/pg_net calls, or a
# provider request signature (Twilio X-Twilio-Signature, Resend/Svix). Several are legitimately
# invoked WITHOUT a Supabase JWT (provider webhooks, pg_cron/pg_net internal calls, the anon
# e-sign signing page, getAppUrl), so JWT verification is disabled at the gateway and enforced
# in-function instead. Keep this list in sync when adding a function.
project_id = "zoyvqznftltlitspgdxn"

[functions.analyzeRecording]
verify_jwt = false
[functions.assemblyAIWebhook]
verify_jwt = false
